<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background-color:black;
            color:white;
            overflow-x:hidden;
        }

        #main{
            height:100vh;
            width:100%;
            position:relative;

            background-image:
            linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.4)),
            url("C:/VS Studio Projects/assests/netflix_background.jpg");

            background-size:cover;
            background-position:center;
        }

        #header{
            width:100%;
            padding:20px 50px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            position:absolute;
            top:0;
            z-index:10;
        }

        #logo{
            width:140px;
            height:45px;
            object-fit:contain;
        }

        #nav-container ul{
            list-style:none;
        }

        li.nav-item{
            display:inline-block;
            margin-right:20px;
            color:white;
            cursor:pointer;
            font-size:15px;
            transition:0.3s;
        }

        li.nav-item:hover{
            color:#e50914;
        }

        #right-icons{
            display:flex;
            gap:15px;
            align-items:center;
        }

        .icon{
            width:35px;
            height:35px;
            background-color:rgba(255,255,255,0.2);
            border-radius:50%;
        }

        #content{
            position:absolute;
            top:35%;
            left:60px;
            max-width:500px;
        }

        #content h1{
            font-size:60px;
            margin-bottom:20px;
            color:#e50914;
        }

        #content p{
            font-size:18px;
            line-height:28px;
            margin-bottom:25px;
        }

        .btn{
            padding:12px 28px;
            border:none;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            border-radius:5px;
            margin-right:15px;
        }

        .play-btn{
            background:white;
            color:black;
        }

        .info-btn{
            background:rgba(109,109,110,0.7);
            color:white;
        }

        #movies{
            padding:30px 50px;
            background:black;
        }

        #movies h2{
            margin-bottom:20px;
        }

        .movie-row{
            display:flex;
            gap:15px;
            overflow-x:auto;
        }

        .movie-card{
            min-width:220px;
            height:130px;
            border-radius:8px;
            overflow:hidden;
            transition:0.3s;
        }

        .movie-card img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .movie-card:hover{
            transform:scale(1.08);
        }

    </style>

</head>

<body>

    <div id="main">

        <div id="header">

            <img id="logo"
                src="C:\VS Studio Projects\assests\netflix_name_logo.png" />

            <div id="nav-container">

                <ul>
                    <li class="nav-item">Home</li>
                    <li class="nav-item">TV Shows</li>
                    <li class="nav-item">Movies</li>
                    <li class="nav-item">New & Popular</li>
                    <li class="nav-item">My List</li>
                    <li class="nav-item">Browse By Languages</li>
                </ul>

            </div>

            <div id="right-icons">
                <div class="icon"></div>
                <div class="icon"></div>
                <div class="icon"></div>
                <div class="icon"></div>
            </div>

        </div>

        <div id="content">
            <h1>NETFLIX</h1>

            <p>
                Unlimited movies, TV shows and more.
                Watch anywhere. Cancel anytime.
            </p>

            <button class="btn play-btn">▶ Play</button>
            <button class="btn info-btn">More Info</button>
        </div>

    </div>

    <section id="movies">

        <h2>Trending Now</h2>

        <div class="movie-row">

            <div class="movie-card">
                <img src="C:\VS Studio Projects\assests\netflix_background.jpg">
            </div>

            <div class="movie-card">
                <img src="C:\VS Studio Projects\assests\netflix_background.jpg">
            </div>

            <div class="movie-card">
                <img src="C:\VS Studio Projects\assests\netflix_background.jpg">
            </div>

            <div class="movie-card">
                <img src="C:\VS Studio Projects\assests\netflix_background.jpg">
            </div>

            <div class="movie-card">
                <img src="C:\VS Studio Projects\assests\netflix_background.jpg">
            </div>

        </div>

    </section>

</body>

</html>
